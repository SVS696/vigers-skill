name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate routes and references
        run: python3 scripts/vigers_context.py validate
      - name: Validate agents, workflow and public profile boundary
        run: python3 scripts/spec_pipeline.py validate
      - name: Run regression tests
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'
